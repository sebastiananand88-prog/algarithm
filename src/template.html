<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}}</title>
  <meta name="description" content="{{page_description}}">
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:description" content="{{page_description}}">
  <meta name="theme-color" content="#e4e2dd">
  <link rel="icon" href="{{assets}}/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{assets}}/styles.css">
  <script>window.SITE = {{config_json}};</script>
{{pixel_script}}
</head>
<body>

<header class="header">
  <img class="logo" src="{{assets}}/img/logo.png" alt="{{brand}}" width="820" height="360">
</header>

<main>
  <section class="hero">
    <h1>{{headline}}</h1>
    <h2 class="subhead">{{subhead}}</h2>
    <p class="sub">{{sub}}</p>
  </section>

  {{vsl}}

  <section class="book loading" id="book">
    <iframe class="ghl-embed ghl-form" data-src="{{form_url}}" id="inline-{{form_id}}" title="{{form_name}}"
      style="width:100%;border:none;border-radius:8px"
      data-layout="{'id':'INLINE'}" data-trigger-type="alwaysShow" data-trigger-value=""
      data-activation-type="alwaysActivated" data-activation-value=""
      data-deactivation-type="neverDeactivate" data-deactivation-value=""
      data-form-name="{{form_name}}" data-height="802" data-layout-iframe-id="inline-{{form_id}}"
      data-form-id="{{form_id}}" data-cookie-consent="true" data-cookie-consent-provider="auto"></iframe>
    <div class="embed-missing" hidden>Form goes here: set form_url in content/{{slug}}.json</div>
  </section>

  <section class="proof">
    <h2>{{proof_title}}</h2>
    <div class="cases">{{cases}}</div>
  </section>

  <section class="final">
    <h2>Become the next success story:</h2>
    <a class="btn" href="#book" data-cta="final">{{cta}} <span aria-hidden="true">→</span></a>
  </section>
</main>

<footer class="footer">
  <p>© {{year}} {{brand}} · <a href="{{privacy_url}}">Privacy policy</a> · <a href="{{terms_url}}">Terms</a></p>
</footer>

<a class="sticky-cta btn" href="#book" data-cta="sticky">{{cta}} <span aria-hidden="true">→</span></a>

<script src="{{assets}}/main.js" defer></script>
</body>
</html>

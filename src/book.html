<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick a time | {{brand}}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e4e2dd">
  <link rel="icon" href="{{assets}}/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{assets}}/styles.css">
  <script>window.SITE = {{config_json}};</script>
  <script>
    // Lead conversion. The landing page's GHL form redirects here on submit (set this page as the
    // form's redirect URL). If GHL appends a contact ID, it becomes the eventID so a server-side
    // CAPI Lead event with the same ID deduplicates.
    window.SITE.afterPixel = function () {
      var q = new URLSearchParams(location.search);
      var id = q.get('contact_id') || String(Date.now()) + Math.random().toString(36).slice(2, 8);
      fbq('track', 'Lead', { content_name: window.SITE.page }, { eventID: 'lead_' + id });
    };
  </script>
{{pixel_script}}
</head>
<body>

<header class="header">
  <img class="logo" src="{{assets}}/img/logo.png" alt="{{brand}}" width="820" height="360">
</header>

<main>
  <section class="thanks">
    <p class="step">Last step</p>
    <h1>Pick a time for your <em>growth call</em></h1>
    <p class="sub">30 minutes with one of our founders. Choose a time that suits you below.</p>
  </section>

  <section class="book book-cal loading" id="book">
    <iframe class="ghl-embed ghl-calendar" title="Book your growth call" scrolling="no" data-src="{{calendar_url}}"></iframe>
    <div class="embed-missing" hidden>Calendar goes here: set calendar_url in content/{{slug}}.json</div>
  </section>
</main>

<footer class="footer">
  <p>© {{year}} {{brand}} · <a href="{{privacy_url}}">Privacy policy</a> · <a href="{{terms_url}}">Terms</a></p>
</footer>

<script src="{{assets}}/main.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're booked in | {{brand}}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e4e2dd">
  <link rel="icon" href="{{assets}}/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{assets}}/styles.css">
  <script>window.SITE = {{config_json}};</script>
  <script>
    // Booking conversion. GHL redirects here after a booking (set this page as the calendar's redirect URL).
    // If GHL appends an appointment or contact ID, it becomes the eventID so a server-side CAPI
    // Schedule event with the same ID deduplicates.
    window.SITE.afterPixel = function () {
      var q = new URLSearchParams(location.search);
      var id = q.get('appointment_id') || q.get('contact_id') || String(Date.now()) + Math.random().toString(36).slice(2, 8);
      fbq('track', 'Schedule', { content_name: window.SITE.page }, { eventID: 'schedule_' + id });
    };
  </script>
{{pixel_script}}
</head>
<body>

<header class="header">
  <img class="logo" src="{{assets}}/img/logo.png" alt="{{brand}}" width="820" height="360">
</header>

<main>
  <section class="thanks">
    <h1>You're <em>booked in</em>.</h1>
    <p class="subhead">Watch this short video before your call</p>
    <p class="sub">It explains how we work, so we can spend the call on your numbers and your market.</p>
  </section>

  <section class="vsl">{{vsl}}</section>

  <section class="proof">
    <h2>{{thanks_proof_title}}</h2>
    <div class="cases">{{thanks_cases}}</div>
  </section>

  <section class="faq-section">
    <h2>Frequently asked questions</h2>
    <div class="faqs">{{faqs}}</div>
  </section>
</main>

<footer class="footer">
  <p>© {{year}} {{brand}} · <a href="{{privacy_url}}">Privacy policy</a> · <a href="{{terms_url}}">Terms</a></p>
</footer>

<script src="{{assets}}/main.js" defer></script>

</body>
</html>
